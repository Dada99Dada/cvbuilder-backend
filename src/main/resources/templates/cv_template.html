<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8"/>
    <title>Curriculum Vitae</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            font-size: 12px;
            color: #2c3e50;
        }

        table.header-table {
            width: 100%;
            margin-bottom: 20px;
        }

        .name-role {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .contact-info {
            font-size: 12px;
            margin-top: 5px;
            color: #555;
        }

        .photo {
            width: 100px;
            border-radius: 10px;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            font-size: 14px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 4px;
            text-transform: uppercase;
        }

        .job {
            margin-bottom: 15px;
        }

        .job-title {
            font-weight: bold;
        }

        .job-date {
            font-style: italic;
            font-size: 11px;
        }

        .skills span,
        .languages span {
            display: inline-block;
            background: #eee;
            padding: 4px 8px;
            margin: 4px 4px 0 0;
            border-radius: 4px;
            font-size: 11px;
        }

        .education-entry {
            margin-bottom: 10px;
        }

        footer {
            text-align: right;
            margin-top: 50px;
            font-size: 10px;
        }

        @page {
            size: A4;
            margin: 20mm;
        }
    </style>
</head>
<body>

<table class="header-table">
    <tr>
        <td style="vertical-align: top;">
            <div class="name-role" th:text="${curriculum.name + ' ' + curriculum.lastName}">Nome Cognome</div>
            <div class="contact-info">
                <div><span th:text="${curriculum.phone}">+39 333...</span></div>
                <div><span th:text="${curriculum.email}">email@example.com</span></div>
                <div><span th:text="${curriculum.address}">Via Roma, 10 - Milano</span></div>
            </div>
        </td>
        <td style="text-align: right; vertical-align: top; width: 110px;">
            <img th:if="${curriculum.photoUrl}" th:src="${curriculum.photoUrl}" alt="Foto" class="photo"/>
        </td>
    </tr>
</table>

<div class="section" th:if="${curriculum.experiences}">
    <h2>Esperienze Lavorative</h2>
    <div th:each="job : ${curriculum.experiences}" class="job">
        <div class="job-title" th:text="${job.position + ' - ' + job.company}"></div>
        <div class="job-date"
             th:text="${#temporals.format(job.fromDate, 'MMMM yyyy')} + ' - ' + ${#temporals.format(job.toDate, 'MMMM yyyy')}"></div>
        <p th:text="${job.description}"></p>
    </div>
</div>

<div class="section" th:if="${curriculum.skills}">
    <h2>Competenze</h2>
    <div class="skills">
        <span th:each="skill : ${curriculum.skills}" th:text="${skill.name}"></span>
    </div>
</div>

<div class="section" th:if="${curriculum.languages}">
    <h2>Lingue Parlate</h2>
    <div class="languages">
        <span th:each="lang : ${curriculum.languages}" th:text="${lang.language + ' (' + lang.level + ')'}"></span>
    </div>
</div>

<div class="section" th:if="${curriculum.educations}">
    <h2>Formazione</h2>
    <div th:each="edu : ${curriculum.educations}" class="education-entry">
        <div th:text="${edu.degree + ' - ' + edu.institution}"></div>
        <div class="job-date" th:text="${edu.fromYear + ' - ' + edu.toYear}"></div>
    </div>
</div>

<div class="section" th:if="${curriculum.sections}">
    <div th:each="sec : ${curriculum.sections}">
        <h2 th:text="${sec.sectionName}">Titolo</h2>
        <p th:text="${sec.contenuto}">Testo...</p>
    </div>
</div>

<footer>
    <strong>
        Generated by CvBuilder - ©
        <a href="https://github.com/Dada99Dada" target="_blank">Davide Amato</a>
    </strong>
</footer>

</body>
</html>
